server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    # Taille maximale du corps de la requête (upload)
    client_max_body_size 1024M;   # ajustez selon vos besoins (ex: 100M, 2G, etc.)
    client_body_buffer_size 128k;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Transmet la vraie IP du visiteur au conteneur Laravel (backend)
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;

        # Timeouts augmentés pour les gros uploads / traitements longs
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.ht {
        deny all;
    }
}