# Protocoles et chiffreurs sécurisés
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;

# Optimisation des sessions SSL
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# Chemins vers les certificats Let's Encrypt (ajustez "votre-domaine.com" par votre vrai domaine)
ssl_certificate /etc/letsencrypt/live/votre-domaine.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/votre-domaine.com/privkey.pem;

# Paramètres de sécurité additionnels (recommandés)
ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

# En-têtes de sécurité HTTP
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
