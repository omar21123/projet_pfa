version: "3.9"

services:
  backend-blue:
    build: ../../app/backend
    container_name: laravel_blue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - /var/www/vendor
      - ../../app/backend:/var/www
    networks:
      - devsecops-net
      - mail-net
      - monitoring-net

  frontend-blue:
    build: ../../app/frontend
    container_name: react_blue
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../../app/frontend:/app
      - /app/node_modules
    networks:
      - devsecops-net

  nginx-blue:
    image: nginx:latest
    container_name: nginx_blue
    ports:
      - "8081:80"
    volumes:
      - ../../app/backend:/var/www
      - ../nginx/blue.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend-blue
    networks:
      - devsecops-net

  mysql:
    image: mysql:8.0
    container_name: mysql_pfa
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../Database/Tables_Indexes.sql:/docker-entrypoint-initdb.d/1_Tables_Indexes.sql
      - ../../Database/SP.sql:/docker-entrypoint-initdb.d/2_SP.sql
      - ../../Database/insert.sql:/docker-entrypoint-initdb.d/3_insert.sql
    networks:
      - devsecops-net

  redis:
    image: redis:alpine
    container_name: redis_blue
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - devsecops-net

networks:
  devsecops-net:
    driver: bridge
  mail-net:
    external: true
    name: mail-net
  monitoring-net:
    external: true
    name: monitoring-net

volumes:
  mysql_data:
