kversion: "3.9"

services:
  backend-green:
    build: ../../app/backend
    container_name: laravel_green
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - /var/www/vendor
      - ../../app/backend:/var/www
    networks:
      - devsecops-net
      - mail-net
      - monitoring-net

  frontend-green:
    build: ../../app/frontend
    container_name: react_green
    restart: unless-stopped
    ports:
      - "5174:5173"
    volumes:
      - ../../app/frontend:/app
      - /app/node_modules
    networks:
      - devsecops-net

  nginx-green:
    image: nginx:latest
    container_name: nginx_green
    ports:
      - "8082:80"
    volumes:
      - ../../app/backend:/var/www
      - ../nginx/green.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend-green
    networks:
      - devsecops-net

  redis-green:
    image: redis:alpine
    container_name: redis_green
    restart: unless-stopped
    networks:
      - devsecops-net

networks:
  devsecops-net:
    external: true
    name: compose_devsecops-net
  mail-net:
    external: true
    name: mail-net
  monitoring-net:
    external: true
    name: monitoring-net

volumes:
  mysql_data:
    external: true
    name: compose_mysql_data
