version: "3.9"

services:
  backend-green:
    build: ./production/backend
    container_name: laravel_green
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./production/backend:/var/www
    networks:
      - devsecops-net

  nginx-green:
    image: nginx:latest
    container_name: nginx_green
    ports:
      - "8082:80" # Port de test isolé
    volumes:
      - ./production/backend:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend-green
    networks:
      - devsecops-net

networks:
  devsecops-net:
    external: true

volumes:
  mysql_data:
    external: true
