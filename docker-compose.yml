version: "3.9"

services:

  backend:
    build: ./backend
    container_name: laravel
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - /var/www/vendor
      - ./backend:/var/www
    depends_on:
      - mysql

  frontend:
    build: ./frontend
    container_name: react
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: devops_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: devops
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
